<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лаборатория стилей — выбери оформление</title>
<style>
  body {
    margin: 0;
    background: #111116;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #toolbar {
    position: sticky;
    top: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(26, 26, 33, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #2e2e3a;
    flex-wrap: wrap;
  }
  #toolbar strong {
    color: #f0f0f5;
    font-size: 14px;
    margin-right: 4px;
  }
  #toolbar button {
    padding: 8px 14px;
    border: 1px solid #2e2e3a;
    border-radius: 999px;
    background: #22222b;
    color: #f0f0f5;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #toolbar button:hover { border-color: #6c5ce7; }
  #toolbar button.active { border-color: #6c5ce7; background: rgba(108, 92, 231, 0.2); }
  iframe#site {
    width: 100%;
    height: 100vh;
    border: 0;
    display: block;
  }
  body.screenshot { background: #000; }
  body.screenshot #toolbar { display: none; }
  body.screenshot iframe#site {
    width: 1200px;
    margin: 0 auto;
    display: block;
    height: auto;
  }
</style>
</head>
<body>
<div id="toolbar">
  <strong>Выбери оформление:</strong>
  <button data-variant="v1-rainbow" class="active">1 · Радужные градиенты</button>
  <button data-variant="v1-tilt">1-ТILT · Радужные + 3D-кнопки</button>
  <button data-variant="v2-sticker">2 · Стикер-поп</button>
  <button data-variant="v3-neon">3 · Неон-градиент</button>
  <button data-variant="v4-candy">4 · Лето-конфетти</button>
  <button data-variant="v5-3d">5 · 3D-глубина</button>
</div>
<iframe id="site" src="index.html"></iframe>
<script>
  var T = document.getElementById('toolbar');
  var I = document.getElementById('site');

  function forceReveal(d) {
    if (!d) return;
    d.querySelectorAll('.reveal, .reveal-scale, .reveal-left, .reveal-right')
      .forEach(function (el) { el.classList.add('visible'); });
    d.querySelectorAll('.skill-card').forEach(function (el, i) {
      el.style.setProperty('--stagger', (i * 0) + 's');
    });
  }

  function applyVariant(name) {
    var d = I.contentDocument;
    if (!d) return;
    d.querySelectorAll('[data-vari-css]').forEach(function (l) { l.remove(); });
    var link = d.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'preview-css/' + (name === 'v1-tilt' ? 'v1-rainbow-tilt.css' : name + '.css');
    link.setAttribute('data-vari-css', '');
    d.head.appendChild(link);
    // JS companion files (e.g. 3D tilt)
    d.querySelectorAll('[data-vari-js]').forEach(function (s) { s.remove(); });
    if (name === 'v5-3d') {
      var js = d.createElement('script');
      js.src = 'preview-css/v5-3d.js';
      js.setAttribute('data-vari-js', '');
      d.body.appendChild(js);
    } else if (name === 'v1-tilt') {
      var j2 = d.createElement('script');
      j2.src = 'preview-css/v1-button-tilt.js';
      j2.setAttribute('data-vari-js', '');
      d.body.appendChild(j2);
    }
    d.documentElement.removeAttribute('data-theme');
    var theme = { 'v2-sticker': 'light', 'v4-candy': 'light' }[name];
    if (theme) d.documentElement.setAttribute('data-theme', theme);
    forceReveal(d);
  }

  T.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    T.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    applyVariant(b.dataset.variant);
  });

  I.addEventListener('load', function () {
    var active = T.querySelector('.active');
    if (active) applyVariant(active.dataset.variant);
  });

  window.showVariant = function (name) {
    applyVariant(name);
    var d = I.contentDocument;
    if (d) {
      // disable parallax transforms so they don't offset layout
      d.querySelectorAll('.parallax-layer').forEach(function (el) {
        el.style.transform = 'none';
      });
      // expand the iframe to the full content height for screenshots
      I.style.height = 'auto';
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      I.style.height = h + 'px';
    }
    document.body.classList.add('screenshot');
  };
  window.showLab = function () {
    document.body.classList.remove('screenshot');
    I.style.height = '100vh';
  };
</script>
</body>
</html>
