<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>1ТILT — 3 стиля наклона кнопок</title>
<style>
  body { margin: 0; background: #111116; font-family: system-ui, sans-serif; color: #f0f0f5; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #a0a0b0; margin: 0 0 18px; font-size: 14px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:#1a1a21; border:1px solid #2e2e3a; border-radius:14px; padding:10px 12px; margin:0 0 18px; position:sticky; top:10px; z-index:10; }
  .toolbar button { padding:8px 14px; border:1px solid #2e2e3a; border-radius:999px; background:#22222b; color:#f0f0f5; font-size:13px; font-weight:600; cursor:pointer; }
  .toolbar button.active { border-color:#7c6cff; background:rgba(124,108,255,.2); }
  iframe#site { width:100%; height:100vh; border:0; display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>1ТILT · 3 стиля наклона кнопок (в сторону мышки)</h1>
  <p class="sub">Выбери стиль наклона ниже — он применится ко ВСЕМ кнопкам (и некоторым ссылкам навигации). Наведи мышку на любую кнопку, чтобы увидеть наклон.</p>
  <div class="toolbar" id="tilt-toolbar">
    <strong>Стиль наклона:</strong>
    <button data-style="1" class="active">1. Subtle (нежный)</button>
    <button data-style="2">2. Medium (средний)</button>
    <button data-style="3">3. Strong (выраженный)</button>
  </div>
  <iframe id="site" src="style-lab.html"></iframe>
</div>
<script>
  var T = document.getElementById('tilt-toolbar');
  var I = document.getElementById('site');
function setStyle(s){
    var d = I.contentDocument;
    if(!d) return;
    var inner = d.getElementById('site');
    var d2 = inner ? inner.contentDocument : d;
    if(d2.documentElement) d2.documentElement.setAttribute('data-tilt-style', String(s));
    d2.querySelectorAll('[data-vari-js]').forEach(function(x){x.remove();});
    var js = d2.createElement('script');
    js.src = 'preview-css/v1-button-tilt.js';
    js.setAttribute('data-vari-js','');
    d2.body.appendChild(js);
  }
  T.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    T.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    setStyle(b.dataset.style);
  });
  I.addEventListener('load', function(){
    var d = I.contentDocument;
    if(!d) return;
    // Активируем вариант 1-TILT в style-lab
    var tbar = d.getElementById('toolbar');
    if(tbar){
      tbar.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      var bt = tbar.querySelector('button[data-variant="v1-tilt"]');
      if(bt) bt.classList.add('active');
    }
    // Применим CSS+JS варианта в iframe index.html
    var inner = d.getElementById('site');
    var d2 = inner ? inner.contentDocument : d;
    d2.querySelectorAll('[data-vari-js]').forEach(function(s){s.remove();});
    var js2 = d2.createElement('script');
    js2.src = 'preview-css/v1-button-tilt.js';
    js2.setAttribute('data-vari-js', '');
    d2.body.appendChild(js2);
    // apply after injection
    setTimeout(function(){ if(d2.documentElement) d2.documentElement.setAttribute('data-tilt-style', '2'); }, 50);
    // force reveals
    d2.querySelectorAll('.reveal,.reveal-scale,.reveal-left,.reveal-right').forEach(function(el){el.classList.add('visible');});
  });
</script>
</body>
</html>
